# The package invariants and the tooling's own tests. Everything here is
# runnable locally with the same commands; CI only makes "all checks pass"
# a fact rather than a claim. Tests run on the oldest Node.js the tooling is
# intended to run on (22) and on the runtime the repo is developed against (26).
name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: checks (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '26']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # check-skill.sh is the single entry point: its check 7 shells out to
      # tools/check-inputs.mjs, so the Inputs coverage check runs here too.
      - name: Package invariants
        run: tools/check-skill.sh

      - name: Shell syntax
        run: |
          for f in docs/gates/.harvest/harvest.sh docs/gates/.harvest/fetch.sh \
                   tools/check-skill.sh; do
            bash -n "$f" || exit 1
          done

      - name: Node syntax
        run: |
          node --check tools/check-inputs.mjs
          node --check docs/gates/fp-measure.mjs

      - name: Tool tests
        run: node --test docs/gates/fp-measure.test.mjs
